<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crescent Foods</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-blobs" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M32 6a18 18 0 1 0 10 32A15 15 0 0 1 32 6z" fill="#fca311"/>
        <circle cx="36" cy="14" r="2.5" fill="#fca311"/>
      </svg>
      <div>
        <h1>Crescent Foods</h1>
        <p>Crescent Public School</p>
      </div>
    </div>
    <div id="userChip" class="user-chip hidden">
      <span id="userLabel"></span>
      <button id="logoutBtn" class="btn-ghost">Logout</button>
    </div>
  </header>

  <main>
    <!-- LOGIN -->
    <section id="view-login" class="view active">
      <div class="card login-card">
        <h2 id="loginTitle">Welcome 👋</h2>
        <p class="muted" id="loginSub">Log in with the student ID and password to order lunch.</p>
        <form id="loginForm" autocomplete="off">
          <label>Student ID
            <input id="loginId" type="text" required placeholder="e.g. CPS1001">
          </label>
          <label>Password
            <input id="loginPass" type="password" required placeholder="Password">
          </label>
          <p id="loginError" class="error"></p>
          <button class="btn-primary" type="submit">Login</button>
        </form>
        <button id="toggleAdmin" class="link-btn" type="button">Admin login</button>
      </div>
    </section>

    <!-- MENU -->
    <section id="view-menu" class="view">
      <div class="section-head">
        <h2>Today's Menu</h2>
        <p class="muted" id="cutoffNote">Orders close at 10:00 AM.</p>
      </div>
      <div id="menuGrid" class="menu-grid"></div>
      <div id="cartBar" class="cart-bar">
        <div><strong id="cartCount">0 items</strong> · <span id="cartTotal">₹0</span></div>
        <button id="cartCheckout" class="btn-primary">Checkout →</button>
      </div>
    </section>

    <!-- SUCCESS -->
    <section id="view-success" class="view">
      <div class="card success-card">
        <svg class="tick" viewBox="0 0 52 52" aria-hidden="true">
          <circle class="tick-circle" cx="26" cy="26" r="24" fill="none"/>
          <path class="tick-check" fill="none" d="M14 27 l8 8 l16-17"/>
        </svg>
        <h2>Order Confirmed!</h2>
        <p class="muted">Order ID <strong id="sOrderId"></strong></p>
        <div id="sSummary" class="receipt"></div>
        <p class="pay-note">Please pay <strong id="sAmount"></strong> in cash at school.</p>
        <button id="newOrderBtn" class="btn-primary">Back to menu</button>
      </div>
    </section>

    <!-- ADMIN -->
    <section id="view-admin" class="view">
      <div class="section-head admin-head">
        <h2>Orders</h2>
        <div class="admin-controls">
          <input id="adminDate" type="date">
          <select id="adminClass"><option value="">All classes</option></select>
          <button id="exportBtn" class="btn-ghost">Export CSV</button>
        </div>
      </div>
      <div id="adminStats" class="
